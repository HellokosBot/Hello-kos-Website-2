<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1A1A">
<title>Drogisterij – Hello Kos</title>
<link rel="stylesheet" href="hello-kos.css">
<style>
.call-list{display:flex;flex-direction:column;gap:10px;margin:12px 0 0}
a.call-btn{display:flex;align-items:center;gap:12px;text-decoration:none;background:linear-gradient(180deg,#3eaeae 0%,#2b7e7e 100%);color:#fff;border:0;border-radius:16px;padding:14px 16px;box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;box-sizing:border-box;max-width:100%}
a.call-btn:active{transform:translateY(1px)}
a.call-btn .ico{flex:0 0 44px;width:44px;height:44px;border-radius:14px;background:var(--gold);color:#1c1404;display:flex;align-items:center;justify-content:center}
a.call-btn .call-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
a.call-btn .call-main{font-weight:800;font-size:1.05rem;line-height:1.25}
a.call-btn .call-sub{font-weight:600;font-size:.8rem;line-height:1.35;color:rgba(255,255,255,.9)}
.strip{display:block;width:100%;height:140px;object-fit:cover;border-radius:14px;margin:0 0 12px}
.card h3{font-size:.95rem;margin:12px 0 8px;color:var(--text)}
.card .actions{margin:12px 0 0}
.hours{margin:4px 0 8px}
.h-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.86rem;color:var(--text-soft)}
.h-row span:last-child{font-weight:700;color:var(--text);text-align:right}
.addr{white-space:pre-line}
.card ul{margin:0 0 8px;padding-left:1.1rem;color:var(--text-soft);font-size:.92rem}
.card li{margin:0 0 4px}
.loc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:14px;margin:0 0 12px}
.loc-card h2{font-size:1.05rem;margin:0 0 8px}
.loc-name{font-weight:800;font-size:1.05rem}
.loc-list a{color:var(--petrol);font-weight:700}

body.hk-page .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
body.hk-page a.shop-card{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;background:#1a2525;text-decoration:none;border:1px solid var(--border);padding:0;margin:0;color:#fff}
body.hk-page a.shop-card .pic{flex:1 1 auto;min-height:0;overflow:hidden;background:#1a2525}
body.hk-page a.shop-card .pic img{width:100%;height:100%;object-fit:cover;display:block}
body.hk-page a.shop-card .card-bar{flex:0 0 auto;display:flex;align-items:flex-end;box-sizing:border-box;width:100%;padding:7px 10px;background:rgba(13,26,26,.9)}
body.hk-page a.shop-card .card-title{color:#fff;font-size:.88rem;font-weight:700;line-height:1.25;display:flex;flex-direction:column;gap:2px}
body.hk-page a.shop-card .card-meta{font-size:.7rem;font-weight:600;opacity:.9;color:#e8f5f3}
body.hk-page h2.section{font-size:1.05rem;font-weight:800;text-align:center;color:var(--gold);margin:2px 0 12px}

.btn-solid{background:var(--petrol);color:#fff}
.loc-list p{margin:0 0 12px;color:var(--text-soft);font-size:.92rem}
.loc-list a{color:var(--petrol);font-weight:700}
</style>
</head>

<a class="shop-card" href="winkel-myrenia.html"><span class="pic"><img src="img/hk/winkel-myrenia-hero.jpg" alt=""></span><span class="card-bar"><span class="card-title" data-i18n="t2">Myrenia Parfume shop</span></span></a>
