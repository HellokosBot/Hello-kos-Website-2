<style>
.wish-lead { font-size: 1.02rem; line-height: 1.5; margin: 0 0 14px; }
a.wish-go {
  display: flex; align-items: center; justify-content: center;
  width: 100%; box-sizing: border-box; min-height: 48px; margin: 0 0 18px;
  padding: 12px 16px; border-radius: 14px;
  background: #3A9A9A; color: #fff; font-weight: 800; text-decoration: none;
  border: 2px solid #2A7A7A;
}
.mode-pick {
  display: block; width: 100%; box-sizing: border-box;
  min-height: 72px; margin: 0 0 12px; padding: 18px 16px;
  border-radius: 18px; border: 2px solid #E0B040;
  background: #152525; color: #E0B040;
  font-family: inherit; font-size: 1.2rem; font-weight: 800; text-align: left;
  cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.28);
}
.mode-pick.drive { border-color: #3A9A9A; color: #8fe0e0; }
.mode-pick.on { background: #E0B040; color: #0d1a1a; border-color: #C4920F; }
.mode-pick.drive.on { background: #3A9A9A; color: #041212; border-color: #2A7A7A; }
.empty-route {
  background: #152525; border: 1px solid rgba(58,154,154,.35); border-radius: 16px;
  padding: 16px; margin-top: 6px;
}
.empty-route p { margin: 0 0 12px; line-height: 1.5; }
.empty-route .wish-go { margin: 0; }
.stop { margin: 0 0 14px; border: 2px solid #fff; border-radius: 16px; overflow: hidden; background: #152525; }
.stop-top { position: relative; background: #1a2525; min-height: 44px; }
.stop img, .stop .ph { width: 100%; height: 150px; object-fit: cover; display: block; }
.drop {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  width: 44px; height: 44px; border: 0; border-radius: 12px;
  background: rgba(13,26,26,.88); color: #fff;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.drop svg { width: 22px; height: 22px; display: block; }
.stop h2 { margin: 0; background: #fff; color: #111; padding: 8px 12px; font-size: 1rem; }
.stop .body { padding: 12px; }
.stop .body p { margin: 0 0 10px; }
.stop a.open-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; box-sizing: border-box; min-height: 44px; margin: 0 0 10px;
  padding: 12px 16px; border-radius: 14px;
  background: #E0B040; color: #0d1a1a;
  font-weight: 800; font-size: 1rem; text-decoration: none;
  border: 2px solid #C4920F;
  box-shadow: 0 4px 0 #8a6810, 0 6px 14px rgba(0,0,0,.35);
}
.stop a.open-btn .book { width: 20px; height: 20px; flex: 0 0 20px; color: inherit; }
.stop a.open-btn:hover { background: #f2cc55; }
.stop a.open-btn:hover .book,
.stop a.open-btn:active .book { animation: hk-book-wiggle 0.45s ease; }
.stop a.open-btn:active { background: #c4920f; transform: translateY(3px); box-shadow: 0 1px 0 #8a6810; }
@keyframes hk-book-wiggle {
  0%, 100% { transform: rotate(0deg) scale(1); }
  35% { transform: rotate(-8deg) scale(1.08); }
  70% { transform: rotate(6deg) scale(1.04); }
}
@media (prefers-reduced-motion: reduce) {
  .stop a.open-btn:hover .book,
  .stop a.open-btn:active .book { animation: none; }
}
.map-row { display: flex; gap: 8px; }
.map-row.route-all { margin: 4px 0 18px; }
.map-row a {
  flex: 1 1 0; width: 0; min-width: 0; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 8px; border-radius: 12px; border: 2px solid var(--petrol);
  background: var(--bg-card); color: var(--petrol); font-weight: 700; font-size: 0.82rem; text-decoration: none;
}
.map-row .pin { width: 16px; height: 16px; flex: 0 0 16px; }
.est { font-size: 0.84rem; color: var(--text-soft); margin: 4px 0 12px; }
</style>
</head>
