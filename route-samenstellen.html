<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1A1A">
<title>Zelf samenstellen – Hello Kos</title>
<link rel="stylesheet" href="hello-kos.css">
<style>
.choice { display: block; width: 100%; box-sizing: border-box; text-align: center; background: #152525; color: var(--text); border: 2px solid var(--petrol); border-radius: 14px; padding: 12px; font-weight: 800; cursor: pointer; font-family: inherit; }
.choice.on { background: var(--petrol); color: #041212; }
.mode-row { display: flex; gap: 8px; margin: 0 0 10px; }
.mode-row .choice { flex: 1; }
#fromFav { margin: 0 0 12px; }
.est { font-size: 0.84rem; color: var(--text-soft); margin: 0 0 12px; }
.map-row { display: flex; gap: 8px; margin-top: 8px; }
.map-row a {
  flex: 1 1 0; width: 0; min-width: 0; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 8px; border-radius: 12px; border: 2px solid var(--petrol);
  background: var(--bg-card); color: var(--petrol); font-weight: 700; font-size: 0.82rem; text-decoration: none;
}
.map-row .pin { width: 16px; height: 16px; flex: 0 0 16px; }
.group h3 { color: var(--gold); font-size: 0.95rem; margin: 12px 0 6px; }
.group label { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 6px; }
</style>
</head>
<body class="hk-page" data-route="custom">
<header class="app-header">
  <div class="nav-btns">
    <a class="nav-btn" href="index.html" title="Home">🏠</a>
    <a class="nav-btn" href="route-wandel.html" title="Terug">←</a>
  </div>
  <a class="logo" href="index.html"><span class="logo-icon">🔅</span><span class="logo-text">Hello <span>Kos</span></span></a>
  <div class="lang-wrap">
    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="flag">🇳🇱</span> <span id="code">NL</span></button>
    <div class="lang-menu" id="langMenu">
      <button class="lang-option" data-lang="nl" data-flag="🇳🇱" type="button">🇳🇱 Nederlands</button>
      <button class="lang-option" data-lang="de" data-flag="🇩🇪" type="button">🇩🇪 Deutsch</button>
      <button class="lang-option" data-lang="en" data-flag="🇬🇧" type="button">🇬🇧 English</button>
      <button class="lang-option" data-lang="it" data-flag="🇮🇹" type="button">🇮🇹 Italiano</button>
      <button class="lang-option" data-lang="tr" data-flag="🇹🇷" type="button">🇹🇷 Türkçe</button>
      <button class="lang-option" data-lang="es" data-flag="🇪🇸" type="button">🇪🇸 Español</button>
    </div>
  </div>
</header>
<div class="overlay" id="overlay"></div>
<main class="main">
  <p class="parent-link"><a href="route-wandel.html" data-i18n="backRoute">← Route</a></p>
  <h1 data-i18n="makeTitle">Zelf samenstellen</h1>
  <p class="lead" id="blurb"></p>
  <div id="customView">
    <div class="mode-row">
      <button type="button" class="choice" id="cWalk" data-i18n="walk">Wandelen</button>
      <button type="button" class="choice" id="cDrive" data-i18n="drive">Rijden (auto/scooter)</button>
    </div>
    <button type="button" class="choice" id="fromFav" data-i18n="fromFav">Route maken van mijn verlanglijst</button>
    <p class="est" id="favNote"></p>
    <div id="checks"></div>
    <p class="est" id="cest"></p>
    <p class="est" id="cTrim" hidden></p>
    <div class="map-row" id="cBtns" hidden></div>
  </div>
</main>
<footer class="hk-footer"><div>Hello Kos</div><p><a href="mailto:info@hellokos.com">info@hellokos.com</a></p></footer>
<script src="hello-kos-route-dict.js"></script>
<script src="hello-kos-i18n.js"></script>
<script src="hello-kos-places.js"></script>
<script src="hello-kos-fav.js"></script>
<script src="hello-kos-route.js"></script>
</body>
</html>
