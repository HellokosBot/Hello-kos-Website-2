    "s6": "Het Kasteel van Antimachia ligt op een heuvel bij het dorp Antimachia, midden op het eiland Kos. Het is een middeleeuws fort met dikke muren en een strategisch uitzicht over het binnenland en de zee. De bouw begon tussen 1322 en 1346 door de Ridders van Sint-Jan (ook wel Johannieters genoemd). Zij beheersten Kos en wilden het eiland beter beschermen tegen aanvallen vanaf het vasteland.",
    "v1": "In juni 1457 viel een groot Ottomaans leger Kos aan met zo'n 16.000 soldaten en een vloot van 156 schepen. Ze begonnen met het verbranden van het kasteel in de stad Kos en vielen daarna andere forten aan zoals die in Pyli en Kefalos. Ze kwamen uiteindelijk bij het Kasteel van Antimachia terecht. Het kasteel werd verdedigd door slechts 15 ridders van de Orde van Sint-Jan (de Hospitaalridders) en ongeveer 200 tot 300 eilandbewoners.",

    "s1": "On top of a hill with beautiful views over the plain and the sea, lies the Castle of Antimachia. This castle was built in the fourteenth century by the Knights of the Order of Saint John. They deliberately chose this high, strategic spot to defend the southern half of the island against pirates and attacks.",

    "s6": "Il castello di Antimachia si trova su una collina vicino al villaggio di Antimachia, al centro dell'isola di Kos. Si tratta di una fortezza medievale dalle spesse mura e con una vista strategica sull'interno e sul mare. La costruzione iniziò tra il 1322 e il 1346 ad opera dei Cavalieri di San Giovanni (detti anche Johannieters). Controllavano Kos e volevano proteggere meglio l'isola dagli attacchi dalla terraferma.",

    "s2": "Kale, tehlike söz konusu olduğunda çoğunlukla çevre köylerin sakinleri için bir sığınak görevi görüyordu. Kalın duvarları, heybetli bir ana kapısı ve surların içindeki birkaç binadan oluşan oldukça büyük bir komplekstir. Ortada Aziz Nikolaos'a adanmış bir kilisenin kalıntıları bulunmaktadır. On beş şövalye ve üç yüz adalı, bir zamanlar en az on altı bin askeri ve yüz elli altı gemiden oluşan bir filoyu yenmişti. Şövalyeler kaleyi on beş ve yirmi üç yaşına kadar kullandılar.",

    "s4": "Daha sonraki yıllarda kısmen restore edilmiş olsa da hâlâ o sağlam ve özgün karakterini koruyor. Bir zamanlar gerçek bir kale olduğunu açıkça görebilirsiniz. Surlardan ve tepeden Kos'un güney kısmının tamamına, zeytinliklere ve hatta uzaktaki Nisiros'a kadar geniş bir manzaraya sahip olursunuz. Açık günlerde manzara gerçekten etkileyicidir.",
    "s5": "Bir an durup Şövalyelerin ne kadar stratejik düşündüğünü anlayabileceğiniz yerlerden biri. Bir tepenin üzerinde sağlam bir kale. tamamen adayı korumak için inşa edilmiştir.",
    "s6": "Antimachia Kalesi, Kos adasının ortasında, Antimachia köyünün yakınındaki bir tepe üzerinde yer almaktadır. Kalın duvarlı, iç ve deniz manzaralı stratejik bir ortaçağ kalesidir. İnşaat 1322 ile 1346 yılları arasında Saint John Şövalyeleri (Johanieters olarak da bilinir) tarafından başlatıldı. Kos'u kontrol altında tutuyorlardı ve adayı ana karadan gelecek saldırılara karşı daha iyi korumak istiyorlardı.",
    "v1": "Haziran 1457'de büyük bir Osmanlı ordusu, yaklaşık 16.000 asker ve 156 gemilik bir filoyla Kos'a saldırdı. Kos kasabasındaki kaleyi yakarak işe başladılar, ardından Pyli ve Kefalos gibi diğer kalelere de saldırdılar. Sonunda kendilerini Antimachia Kalesi'nde buldular. Kale, St. John Tarikatı'ndan (Hospitaller Şövalyeleri) yalnızca 15 şövalye ve yaklaşık 200 ila 300 adalı tarafından savundu.",
    "v2": "Çoğu, genellikle silahsız veya basit silahlara sahip sıradan çiftçiler veya sivillerdi. Ancak 26 Haziran 1457'ye kadar 23 gün süren kuşatmada direndiler. Savunmayı şövalyeler yönetti; halkı örgütlediler, kalın duvarları ve yüksek yerleri kullandılar, saldırıları püskürttüler. Osmanlılar surların altına tüneller (mayınlar) bile kazarak onları havaya uçurmaya çalıştı ama savunmacılar bunu fark edip durdurdu.",
    "v3": "Bu kahramanca direniş Osmanlı'yı teslim olmaya ve adayı terk etmeye zorladı. Kos'un pek çok sakini artık kalede güvenli bir sığınak bulmuştu. Günlerce süren çatışmaların ardından saldırganlar pes ederek geri çekildi. Bu kale tarihindeki en kahramanca anlardan biriydi",
    "v4": "1493'teki büyük depremden sonra kale yeniden inşa edildi ve güçlendirildi. Daha sonra Osmanlılar iktidara gelerek kaleyi 1871 yılına kadar askeri üs olarak kullandı. Daha sonra yavaş yavaş bakıma muhtaç hale geldi.",
    "v5": "Bugün esas olarak sağlam dış duvarları, kule kalıntılarını ve 1500'lerin başlarından kalma, kapısı üzerinde 1520 tarihi bulunan küçük bir kilisenin içini görüyorsunuz. Yayladan çok güzel bir manzara var,",
    "k1": "Giriş tamamen ücretsizdir. Arazide özgürce dolaşabilirsiniz. Sabit bir çalışma saati yoktur, ancak gün içinde ziyaret etmek en iyisidir."
  },

    "s1": "En lo alto de una colina con hermosas vistas sobre la llanura y el mar, se encuentra el Castillo de Antimachia. Este castillo fue construido en el siglo XIV por los Caballeros de la Orden de San Juan. Eligieron deliberadamente este lugar alto y estratégico para defender la mitad sur de la isla contra piratas y ataques.",

    "s5": "Es uno de esos lugares donde te detienes por un momento y te das cuenta de cuán estratégicamente solían pensar los Caballeros. Una fortaleza robusta en lo alto de una colina. construido exclusivamente para proteger la isla.",
    "s6": "El castillo de Antimachia está situado en una colina cerca del pueblo de Antimachia, en el centro de la isla de Kos. Se trata de una fortaleza medieval de gruesos muros y con una estratégica vista sobre el interior y el mar. La construcción se inició entre 1322 y 1346 por los Caballeros de San Juan (también llamados Johannieters). Controlaban Kos y querían proteger mejor la isla contra los ataques del continente.",
    "v1": "En junio de 1457, un gran ejército otomano atacó Kos con unos 16.000 soldados y una flota de 156 barcos. Comenzaron quemando el castillo de la ciudad de Kos y luego atacaron otras fortalezas como las de Pyli y Kefalos. Finalmente terminaron en el Castillo de Antimachia. El castillo fue defendido por sólo 15 caballeros de la Orden de San Juan (los Caballeros Hospitalarios) y entre 200 y 300 isleños.",
