<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0a0c0c">
  <title>Excursions & activities – Hello Kos</title>
  <style>
    :root {
      --bg: #0a0c0c; --bg-elevated: #141818; --border: rgba(255,255,255,0.08);
      --text: #e8e8e8; --text-soft: #a0a8a8; --petrol: #3d9a9a; --gold: #e0b84a;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
    }
    .app-header {
      position: sticky; top: 0; z-index: 50;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 14px 16px; background: rgba(10,12,12,0.94); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .back { color: var(--petrol); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .logo { justify-self: center; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-icon { font-size: 24px; }
    .logo-text { font-family: Georgia, serif; font-weight: 700; color: var(--gold); font-size: 1.15rem; }
    .logo-text span { font-style: italic; color: #f0c85a; }
    .main { max-width: 480px; margin: 0 auto; padding: 18px 14px 40px; }
    h1 { text-align: center; font-size: 1.25rem; margin-bottom: 6px; }
    .lead { text-align: center; color: var(--text-soft); font-size: 0.9rem; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card {
      position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 0.95;
      text-decoration: none; color: #fff; border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.82); }
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.78) 0%, transparent 48%);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 12px 8px; text-align: center;
    }
    .card-title {
      font-size: 0.88rem; font-weight: 800; line-height: 1.25;
      text-shadow: 0 1px 6px rgba(0,0,0,0.85); width: 100%; text-align: center;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a class="back" href="index.html">← Home</a>
    <a class="logo" href="index.html"><span class="logo-icon">🔅</span><span class="logo-text">Hello <span>Kos</span></span></a>
    <div></div>
  </header>
  <main class="main">
    <h1>Excursions & activities</h1>
    <p class="lead">Choose an activity · book via WhatsApp</p>
    <div class="grid">
      <a class="card" href="excursie-3-eilanden.html">

        <div class="card-overlay"><div class="card-title">3 Islands<br>boat tour</div></div>
      </a>
      <a class="card" href="excursie-bodrum.html">

      </a>
      <a class="card" href="excursie-glazenboot.html">

        <div class="card-overlay"><div class="card-title">Glass<br>bottom boat</div></div>
      </a>
      <a class="card" href="excursie-duiken.html">

      </a>
      <a class="card" href="excursie-waterpark.html">

      <a class="card" href="excursie-griekse-avond.html">

      </a>
      <a class="card" href="excursie-massage.html">

      </a>
      <a class="card" href="excursie-therma.html">

        <div class="card-overlay"><div class="card-title">Therma<br>hot springs</div></div>
      </a>
      <a class="card" href="excursie-paard.html">

      </a>
      <a class="card" href="excursie-karten.html">
        <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&h=430&fit=crop&q=80" alt="">

      </a>
    </div>
  </main>
</body>
</html>
