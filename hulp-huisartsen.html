body.hk-page .hero-wrap { aspect-ratio: auto; height: 140px; }

.swipe-wrap { position: relative; margin: 0 0 8px; }
.swipe { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 0 0 10px; -webkit-overflow-scrolling: touch; }
.swipe::-webkit-scrollbar { height: 0; }
.swipe-card { flex: 0 0 78%; scroll-snap-align: start; position: relative; height: 180px; border-radius: 16px; overflow: hidden; text-decoration: none; border: 1px solid var(--border); }
.swipe-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.swipe-card span { position: absolute; left: 10px; right: 10px; bottom: 10px; color: #fff; font-weight: 800; font-size: 1rem; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.swipe-btn { position: absolute; top: 70px; z-index: 2; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(13,26,26,.82); color: var(--gold); font-size: 1.3rem; cursor: pointer; }
.swipe-prev { left: 6px; }
.swipe-next { right: 6px; }
.dots { display: flex; justify-content: center; gap: 8px; margin: 0 0 8px; }
.dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; background: #3a4a4a; padding: 0; cursor: pointer; }
.dots button.on { background: var(--gold); }

<script>
(function () {
  var scroller = document.getElementById("swipe");
  var cards = scroller.querySelectorAll(".swipe-card");
  var dots = document.querySelectorAll("#dots button");
  function go(index) {
    var card = cards[index];
    if (card) scroller.scrollTo({ left: card.offsetLeft, behavior: "smooth" });
  }
  document.getElementById("swipePrev").addEventListener("click", function () {
    scroller.scrollBy({ left: -cards[0].offsetWidth * 0.9, behavior: "smooth" });
  });
  document.getElementById("swipeNext").addEventListener("click", function () {
    scroller.scrollBy({ left: cards[0].offsetWidth * 0.9, behavior: "smooth" });
  });
  dots.forEach(function (dot, index) {
    dot.addEventListener("click", function () { go(index); });
  });
  scroller.addEventListener("scroll", function () {
    var index = 0;
    var best = Infinity;
    cards.forEach(function (card, i) {
      var dist = Math.abs(card.offsetLeft - scroller.scrollLeft);
      if (dist < best) { best = dist; index = i; }
    });
    dots.forEach(function (dot, i) { dot.classList.toggle("on", i === index); });
  });
})();
</script>
