name: DEDDIE planned outages

on:
  schedule:
    # Once an hour. Planned cuts are published ahead of time, not second by second.
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the public DEDDIE list
        run: python3 tools/update-deddie-outages.py
      - name: Commit the list when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deddie-outages.json
          git diff --staged --quiet && exit 0
          git commit -m "Update the DEDDIE planned-outage list"
          git push
