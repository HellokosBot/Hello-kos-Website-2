<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0D1F1F">
  <title>Cocktails – Hello Kos</title>
  <style>
    :root {
      --petrol: #3A9A9A; --petrol-dark: #2A7A7A; --petrol-deep: #1A4A4A;
      --bg: #0D1A1A; --bg-card: #152525; --bg-header: rgba(13, 26, 26, 0.92);
      --text: #E8EDE8; --text-soft: #A0B0A0;
      --border: rgba(58, 154, 154, 0.18); --gold: #E0B040; --gold-dark: #C4920F;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.45;
      padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
    }
    .app-header {
      position: sticky; top: 0; z-index: 100;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 14px 16px; background: var(--bg-header);
      backdrop-filter: blur(18px); border-bottom: 1px solid var(--border);
    }
    .back-btn { grid-column: 1; color: var(--petrol); font-weight: 600; text-decoration: none; font-size: 0.9rem; }
    .logo { grid-column: 2; justify-self: center; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-icon { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(145deg, #F0C040, #D4A017); display: flex; align-items: center; justify-content: center; color: #FFFDF5; font-size: 20px; }
    .logo-text { font-size: 1.2rem; font-weight: 700; color: var(--gold); font-family: Georgia, serif; }
    .logo-text span { color: var(--gold-dark); font-style: italic; }
    .lang-wrap { grid-column: 3; justify-self: end; position: relative; }
    .lang-btn { display: flex; align-items: center; gap: 6px; background: rgba(58,154,154,0.15); border: 1px solid var(--border); color: var(--text); font-weight: 700; font-size: 0.85rem; padding: 6px 10px; border-radius: 20px; cursor: pointer; }
    .lang-menu { display: none; position: absolute; right: 0; top: 44px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; min-width: 140px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 200; }
    .lang-menu.open { display: block; }
    .lang-option { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px; background: none; border: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    .lang-option:hover, .lang-option.active { background: rgba(58,154,154,0.18); }
    .main { max-width: 480px; margin: 0 auto; padding: 16px 14px 40px; }
    h1 { font-size: 1.2rem; font-weight: 800; color: var(--text); text-align: center; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 0.86rem; color: var(--text-soft); margin-bottom: 16px; }
    .acc { background: var(--bg-card); border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border); overflow: hidden; }
    .acc-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 1rem; font-weight: 700; color: var(--text); text-align: left; }
    .acc-btn .count { font-size: 0.75rem; font-weight: 600; color: #99f6e4; background: rgba(58,154,154,0.18); padding: 4px 10px; border-radius: 999px; margin-left: auto; margin-right: 8px; }
    .acc-btn .chev { color: var(--petrol); transition: transform 0.2s; }
    .acc.open .acc-btn .chev { transform: rotate(180deg); }
    .acc-body { display: none; padding: 0 12px 14px; }
    .acc.open .acc-body { display: block; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { display: block; position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1; background: #1a2525 center/cover no-repeat; text-decoration: none; border: 1px solid var(--border); }
    .card-overlay { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 12px; background: linear-gradient(to top, rgba(0,0,0,0.72), transparent 55%); }
    .card-title { color: #fff; font-size: 0.85rem; font-weight: 700; line-height: 1.25; display: flex; flex-direction: column; gap: 2px; }
    .card-meta { font-size: 0.68rem; font-weight: 600; opacity: 0.9; color: #e8f5f3; }
    .footer { text-align: center; padding: 20px; font-size: 0.78rem; color: var(--text-soft); }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="beste-lekkerste.html" class="back-btn">← Terug</a>
    <a href="index.html" class="logo">
      <div class="logo-icon">🔅</div>
      <div class="logo-text">Hello <span>Kos</span></div>
    </a>
    <div class="lang-wrap">
      <button type="button" class="lang-btn" id="langBtn">
        <span id="flag">🇳🇱</span> <span id="code">NL</span>
      </button>
      <div class="lang-menu" id="langMenu">
        <button class="lang-option" data-lang="nl" data-flag="🇳🇱">🇳🇱 Nederlands</button>
        <button class="lang-option" data-lang="en" data-flag="🇬🇧">🇬🇧 English</button>
        <button class="lang-option" data-lang="de" data-flag="🇩🇪">🇩🇪 Deutsch</button>
        <button class="lang-option" data-lang="it" data-flag="🇮🇹">🇮🇹 Italiano</button>
        <button class="lang-option" data-lang="tr" data-flag="🇹🇷">🇹🇷 Türkçe</button>
        <button class="lang-option" data-lang="es" data-flag="🇪🇸">🇪🇸 Español</button>
      </div>
    </div>
  </header>
  <main class="main">
    <h1 data-i18n="title">Cocktails</h1>
    <p class="sub" data-i18n="sub">Klap een regio open</p>
    <div class="acc open" id="acc-0">
      <button type="button" class="acc-btn" onclick="document.getElementById('acc-0').classList.toggle('open')">
        <span data-i18n="acc0">Kos-stad</span> <span class="count">5</span><span class="chev">▼</span>
      </button>
      <div class="acc-body"><div class="grid">
        <a class="card" href="cocktail-c-food-mood.html" style="background-image:url('https://primary.jwwb.nl/public/k/r/d/temp-qrlwbsokdnzonzcjodwm/getlstd-property-photo-1-high-qn56dh.jpg')">
          <div class="card-overlay"><span class="card-title">C Food & Mood<span class="card-meta" data-i18n="meta1">Cocktailbar</span></span></div>
        </a>
        <a class="card" href="cocktail-kaseta-caf.html" style="background-image:url('https://primary.jwwb.nl/public/k/r/d/temp-qrlwbsokdnzonzcjodwm/caption-51-high-3uihw3.jpg')">
          <div class="card-overlay"><span class="card-title">Kaseta Café<span class="card-meta" data-i18n="meta2">Cocktails</span></span></div>
        </a>
        <a class="card" href="cocktail-sitar.html" style="background-image:url('https://primary.jwwb.nl/public/k/r/d/temp-qrlwbsokdnzonzcjodwm/468481007_18341976535181187_4546482844185305636_n-high-025ll3.jpg')">
          <div class="card-overlay"><span class="card-title">Sitar<span class="card-meta" data-i18n="meta3">Cocktailbar</span></span></div>
        </a>
        <a class="card" href="cocktail-soul-kitchen.html" style="background-image:url('https://primary.jwwb.nl/public/k/r/d/temp-qrlwbsokdnzonzcjodwm/nice-view-high.jpg')">
          <div class="card-overlay"><span class="card-title">Soul Kitchen<span class="card-meta" data-i18n="meta4">Cocktails & diner</span></span></div>
        </a>
        <a class="card" href="cocktail-vie-caf.html" style="background-image:url('https://primary.jwwb.nl/public/k/r/d/temp-qrlwbsokdnzonzcjodwm/photo2jpg-high.jpg')">
          <div class="card-overlay"><span class="card-title">Vie Café<span class="card-meta" data-i18n="meta5">Café & cocktails</span></span></div>
        </a>
      </div></div>
    </div>
    <div class="acc" id="acc-1">
      <button type="button" class="acc-btn" onclick="document.getElementById('acc-1').classList.toggle('open')">
        <span data-i18n="acc1">Strand</span> <span class="count">1</span><span class="chev">▼</span>
      </button>
      <div class="acc-body"><div class="grid">
        <a class="card" href="cocktail-mylos-beach-bar.html" style="background-image:url('https://primary.jwwb.nl/public/k/r/d/temp-qrlwbsokdnzonzcjodwm/caption-55-high-lclfbb.jpg')">
          <div class="card-overlay"><span class="card-title">Mylos Beach Bar<span class="card-meta" data-i18n="meta6">Cocktails aan zee</span></span></div>
        </a>
      </div></div>
    </div>
  </main>
  <footer class="footer">Hello Kos</footer>

<script>
(function(){
  var I18N = {
    nl: {
      title: "Cocktails",
      sub: "Klap een regio open",
      acc0: "Kos-stad",
      acc1: "Strand",
      meta1: "Cocktailbar",
      meta2: "Cocktails",
      meta3: "Cocktailbar",
      meta4: "Cocktails & diner",
      meta5: "Café & cocktails",
      meta6: "Cocktails aan zee"
    },
    en: {
      title: "Cocktails",
      sub: "Open a region",
      acc0: "Kos town",
      acc1: "Beach",
      meta1: "Cocktail bar",
      meta2: "Cocktails",
      meta3: "Cocktail bar",
      meta4: "Cocktails & dinner",
      meta5: "Café & cocktails",
      meta6: "Cocktails by the sea"
    },
    de: {
      title: "Cocktails",
      sub: "Region öffnen",
      acc0: "Kos-Stadt",
      acc1: "Strand",
      meta1: "Cocktailbar",
      meta2: "Cocktails",
      meta3: "Cocktailbar",
      meta4: "Cocktails & Dinner",
      meta5: "Café & Cocktails",
      meta6: "Cocktails am Meer"
    },
    it: {
      title: "Cocktail",
      sub: "Apri una zona",
      acc0: "Città di Kos",
      acc1: "Spiaggia",
      meta1: "Cocktail bar",
      meta2: "Cocktail",
      meta3: "Cocktail bar",
      meta4: "Cocktail & cena",
      meta5: "Caffè & cocktail",
      meta6: "Cocktail in riva al mare"
    },
    tr: {
      title: "Kokteyller",
      sub: "Bir bölge aç",
      acc0: "Kos şehri",
      acc1: "Plaj",
      meta1: "Kokteyl bar",
      meta2: "Kokteyller",
      meta3: "Kokteyl bar",
      meta4: "Kokteyl & akşam yemeği",
      meta5: "Kafe & kokteyller",
      meta6: "Deniz kenarında kokteyller"
    },
    es: {
      title: "Cócteles",
      sub: "Abre una zona",
      acc0: "Ciudad de Kos",
      acc1: "Playa",
      meta1: "Bar de cócteles",
      meta2: "Cócteles",
      meta3: "Bar de cócteles",
      meta4: "Cócteles y cena",
      meta5: "Café y cócteles",
      meta6: "Cócteles junto al mar"
    }
  };

  function setLang(l) {
    if (!I18N[l]) l = 'nl';
    localStorage.setItem('hk-lang', l);
    document.documentElement.lang = l;
    var d = I18N[l];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n');
      if (d[k]) el.textContent = d[k];
    });
    var opt = document.querySelector('.lang-option[data-lang="'+l+'"]');
    if (opt) {
      document.getElementById('flag').textContent = opt.getAttribute('data-flag');
      document.getElementById('code').textContent = l.toUpperCase();
    }
    document.querySelectorAll('.lang-option').forEach(function(o){
      o.classList.toggle('active', o.getAttribute('data-lang') === l);
    });
    closeMenu();
  }

  var langBtn = document.getElementById('langBtn');
  var langMenu = document.getElementById('langMenu');
  function openMenu(){ langMenu.classList.add('open'); }
  function closeMenu(){ langMenu.classList.remove('open'); }
  langBtn.addEventListener('click', function(e){
    e.stopPropagation();
    langMenu.classList.contains('open') ? closeMenu() : openMenu();
  });
  document.addEventListener('click', closeMenu);
  document.querySelectorAll('.lang-option').forEach(function(btn){
    btn.addEventListener('click', function(){ setLang(btn.getAttribute('data-lang')); });
  });

  var saved = localStorage.getItem('hk-lang') || 'nl';
  setLang(saved);
})();
</script>
</body>
</html>
