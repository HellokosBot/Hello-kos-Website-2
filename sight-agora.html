    "s6": "Lamentablemente, se ha perdido mucho. En los siglos V y VI d.C., fuertes terremotos provocaron el colapso y destrucción del Ágora. Sólo durante el gran terremoto de 1933 reaparecieron partes de la antigua Ágora.",
    "v1": "Los italianos vieron su oportunidad, ya que toda la zona había sido destruida y podían realizar excavaciones fácilmente. Así resurgió esta antigua plaza. Gracias por escuchar.",
    "v2": "Esperamos que te hayas vuelto un poco más sabio y pases a la siguiente ubicación.",
    "v3": "En el centro de Kosstad encontrará los restos de la antigua Ágora que una vez estuvo aquí. Agora era el mercado ubicado en el corazón de Kosstad. Alguna vez fue el más grande de su área y se perdió durante los terremotos de los siglos V y VI d.C.",
    "v4": "Durante el gran terremoto de 1933, muchas piezas quedaron expuestas y los arqueólogos italianos vieron la oportunidad y excavaron las partes subyacentes. (Los italianos gobernaban Kos en ese momento) El Ágora solía ser el lugar donde tenía lugar la vida social y tenía diferentes funciones: política, social y comercial.",
    "v5": "La palabra Ágora significa lugar de reunión. El Ágora fue inicialmente un lugar de reunión de ciudadanos libres (hombres, porque el trabajo lo realizaban generalmente mujeres y esclavos). Originalmente aquí también se reunía la Ekklèsia (asamblea popular). Además, el Ágora se utilizaba como mercado y lugar donde la gente podía relajarse.",
    "k1": "Además, alrededor del Ágora a menudo había templos dedicados a todo tipo de dioses principalmente populares. El Ágora era el punto de encuentro de todos los hombres, que se entregaban a su actividad favorita en la plaza o a la sombra de los stoai (salones de columnas): la conversación. La gente venía aquí para escuchar las últimas noticias y recibir \"enseñanzas\" de todo tipo de filósofos."
