<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1A1A">
<title>Route – Hello Kos</title>
<link rel="stylesheet" href="hello-kos.css">
<style>
.step-label { font-size: 0.78rem; font-weight: 700; color: var(--petrol); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }
.choices { display: flex; flex-direction: column; gap: 10px; margin: 0 0 14px; }
.pick { display: flex; flex-direction: column; width: 100%; padding: 0; border: 2px solid #fff; border-radius: 16px; overflow: hidden; background: #1a2525; cursor: pointer; font-family: inherit; text-align: left; }
.pick img { width: 100%; height: 120px; object-fit: cover; display: block; }
.pick-bar { background: #fff; color: #0d1a1a; font-weight: 800; padding: 8px 12px; font-size: 1rem; }
.pick.on { box-shadow: 0 0 0 3px #3A9A9A; }
.choice { display: block; width: 100%; box-sizing: border-box; text-align: center; background: #152525; color: var(--text); border: 2px solid var(--petrol); border-radius: 14px; padding: 12px; font-weight: 800; cursor: pointer; font-family: inherit; }
.choice.on { background: var(--petrol); color: #041212; }
.mode-row { display: flex; gap: 8px; margin: 0 0 10px; }
.mode-row .choice { flex: 1; }
#fromFav { margin: 0 0 12px; }
.est { font-size: 0.84rem; color: var(--text-soft); margin: 0 0 12px; }
.stop { margin: 0 0 14px; border: 2px solid #fff; border-radius: 16px; overflow: hidden; background: #152525; }
.stop img { width: 100%; height: 150px; object-fit: cover; display: block; }
.stop h2 { margin: 0; background: #fff; color: #0d1a1a; padding: 8px 12px; font-size: 1rem; }
.stop p { margin: 0; padding: 10px 12px 0; }
.stop .info a { color: var(--petrol); font-weight: 700; text-decoration: none; }
.map-row { display: flex; gap: 8px; margin-top: 8px; }
.stop .map-row, #routeView > .map-row { padding: 0 12px 12px; }
.map-row a {
  flex: 1 1 0; width: 0; min-width: 0; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 8px; border-radius: 12px; border: 2px solid var(--petrol);
  background: var(--bg-card); color: var(--petrol); font-weight: 700; font-size: 0.82rem; text-decoration: none;
}
.map-row .pin { width: 16px; height: 16px; flex: 0 0 16px; }
.group h3 { color: var(--gold); font-size: 0.95rem; margin: 12px 0 6px; }
.group label { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 6px; }
</style>
</head>
<body class="hk-page">
<header class="app-header">
  <div class="nav-btns">
    <a class="nav-btn" href="index.html" title="Home">🏠</a>
    <a class="nav-btn" href="bezienswaardigheden.html" title="Terug">←</a>
  </div>
  <a class="logo" href="index.html"><span class="logo-icon">🔅</span><span class="logo-text">Hello <span>Kos</span></span></a>
  <div class="lang-wrap">
    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="flag">🇳🇱</span> <span id="code">NL</span></button>
    <div class="lang-menu" id="langMenu">
      <button class="lang-option" data-lang="nl" data-flag="🇳🇱" type="button">🇳🇱 Nederlands</button>
      <button class="lang-option" data-lang="de" data-flag="🇩🇪" type="button">🇩🇪 Deutsch</button>
      <button class="lang-option" data-lang="en" data-flag="🇬🇧" type="button">🇬🇧 English</button>
      <button class="lang-option" data-lang="it" data-flag="🇮🇹" type="button">🇮🇹 Italiano</button>
      <button class="lang-option" data-lang="tr" data-flag="🇹🇷" type="button">🇹🇷 Türkçe</button>
      <button class="lang-option" data-lang="es" data-flag="🇪🇸" type="button">🇪🇸 Español</button>
    </div>
  </div>
</header>
<div class="overlay" id="overlay"></div>
<main class="main">
  <p class="parent-link"><a href="bezienswaardigheden.html" data-i18n="back">← Bezienswaardigheden</a></p>
  <h1 data-i18n="title">Route</h1>
  <p class="step-label" data-i18n="s1">Stap 1</p>
  <div class="choices" id="step1">
    <button type="button" class="pick" data-mode="walk"><img src="img/hk/sight-witte-trappen-card.jpg" alt=""><span class="pick-bar" data-i18n="walk">Wandelen</span></button>
    <button type="button" class="pick" data-mode="drive"><img src="img/hk/sight-asklepion.jpg" alt=""><span class="pick-bar" data-i18n="drive">Rijden (auto/scooter)</span></button>
    <button type="button" class="pick" data-mode="custom"><img src="img/hk/sight-old-town-card.jpg" alt=""><span class="pick-bar" data-i18n="custom">Zelf samenstellen</span></button>
  </div>
  <div id="step2" hidden>
    <p class="step-label" data-i18n="s2">Stap 2</p>
    <div class="choices">
      <button type="button" class="pick" data-len="short"><img src="img/hk/sight-i-love-kos-card.jpg" alt=""><span class="pick-bar" data-i18n="shortR">Korte route</span></button>
      <button type="button" class="pick" data-len="long"><img src="img/hk/sight-zia.jpg" alt=""><span class="pick-bar" data-i18n="longR">Lange route</span></button>
    </div>
  </div>
  <p class="lead" id="blurb"></p>
  <p class="est" id="est"></p>
  <div id="routeView"></div>
  <div id="customView" hidden>
    <div class="mode-row">
      <button type="button" class="choice" id="cWalk" data-i18n="walk">Wandelen</button>
      <button type="button" class="choice" id="cDrive" data-i18n="drive">Rijden (auto/scooter)</button>
    </div>
    <button type="button" class="choice" id="fromFav" data-i18n="fromFav">Route maken van mijn verlanglijst</button>
    <p class="est" id="favNote"></p>
    <div id="checks"></div>
    <p class="est" id="cest"></p>
    <p class="est" id="cTrim" hidden></p>
    <div class="map-row" id="cBtns" hidden></div>
  </div>
</main>
<footer class="hk-footer"><div>Hello Kos</div><p><a href="mailto:info@hellokos.com">info@hellokos.com</a></p></footer>
<script src="hello-kos-route-dict.js"></script>
<script src="hello-kos-i18n.js"></script>
<script src="hello-kos-places.js"></script>
<script src="hello-kos-fav.js"></script>
<script src="hello-kos-route-text.js"></script>
<script src="hello-kos-route.js"></script>
</body>
</html>
