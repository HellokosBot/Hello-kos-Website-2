    "v1": "1902 yılında Kos'lu tarihçi Lakovos Zaraftis'in talimatıyla, 1904 yılında ise Alman Rudolf Herzog tarafından kazılmıştır. Hipokrat'ın Kos'taki Asklepion üzerinde büyük etkisi vardı. Bu doktor (Hipokrat) M.Ö. 460 yılında Kos adasında doğmuştur.",
    "v2": "Büyüyü ve dini tıptan çıkardı. Hem doktor hem de hasta açısından hijyene, sağlıklı yeme ve içme alışkanlıklarına, temiz havanın önemine ve vücuttaki süreçlerin doğal seyrine büyük önem verdi.",
    "v3": "Asklepeion bir tapınaktan çok daha fazlasıydı. Aynı anda bir nevi hastane, spa ve tıp okulu olarak faaliyet gösteriyordu. Hasta insanlar uzaklardan yardım istemek için geldiler. Kurbanlar (çoğunlukla bir horoz veya öküz) sundular, Asklepios'un rüyalarında öğüt vermesi umuduyla tapınakta uyudular ve banyo, şifalı bitkiler, dinlenme ve doktorlara danışmayı içeren tedaviler gördüler. Hipokrat'ın fikirleri burada daha da geliştirilerek öğrencilere aktarıldı.",
    "v4": "Öğrencilerine zorunlu kıldığı ve şimdi mezuniyette yerine getirilecek ciddi bir tıp yemini tasarladı. Hipokrat Yemini hala her doktor tarafından tutulmaktadır.",
    "v5": "Asklepion Tapınağı'nda zehirsiz yılanlar barındırılırdı. Rahipler bu yılanların yatakhanelerde serbestçe dolaşmasına izin verdiler. Hastalar yerde ya da alçak yataklarda uyurken, yılanlar uyuyan insanların üzerinde geziniyordu; bu, ilahi varlığın ve dokunuşun doğrudan bir işareti olarak kabul ediliyordu. Bazen yaraları yaladılar, muhtemelen tükürüklerindeki enzimler sayesinde iyileşiyorlardı. Hipokrat'ın kendisi bu mucizevi şifayı reddetti.",
