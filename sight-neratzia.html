    "lead": "We staan nu bij het Kasteel Neratzia, ook wel bekend als het Kasteel van de Ridders.",
    "s1": "We staan nu bij het Kasteel Neratzia, ook wel bekend als het Kasteel van de Ridders. Dit kasteel ligt direct aan de haven, pal bij de ingang van Kos-stad. Vroeger lag het op een klein eilandje dat met een ophaalbrug verbonden was met het vasteland.",
    "s2": "Door dat men het water gedempt heeft, wat nu de weg is met de palmbomen, men moet nog wel via de brug het kasteel in De Ridders van de Orde van Sint-Jan begonnen met de bouw van het kasteel eind veertiende eeuw. De echte hoofdconstructie startte in veertien zesendertig en werd pas achtenzeventig jaar later afgerond. Ze bouwden het in twee delen: een binnenste vesting met vier ronde torens en later een buitenste omwalling met extra bastions.",
    "s3": "Voor de bouw gebruikten ze veel stenen uit oude ruïnes, waaronder van het Asklepion. De ridders hadden het kasteel nodig om de haven te beschermen tegen piraten en aanvallen van de Ottomanen en de Egyptische Mamlukken. In veertien zevenenvijftig hielden de Ottomanen het kasteel drieëntwintig dagen onder beleg, maar ze trokken zich uiteindelijk terug.",
    "s4": "In vijftien drieëntwintig verlieten de ridders Kos na hun nederlaag op Rhodos. Daarna namen de Ottomanen het kasteel over. Het diende als garnizoen en residentie voor de Ottomaanse gouverneur.",
    "s5": "In achttien zestien ontplofte het kruitmagazijn, waardoor een groot deel van het kasteel werd verwoest. Tijdens de Italiaanse periode in de twintigste eeuw restaureerden de Italianen het kasteel grondig. Ze haalden Ottomaanse toevoegingen weg en probeerden het zoveel mogelijk in middeleeuwse stijl terug te brengen.",
    "s6": "Je ziet de dubbele muren, de ronde torens en de resten van de oude vestingwerken. Vanaf de muren heb je een mooi uitzicht over de haven en de stad.",
    "s7": "De naam Neratzia komt van de bittere sinaasappelbomen (nerantzia) die de ridders overal op Kos plantten in de late 14e en vroege 15e eeuw – het eiland rook er toen heerlijk naar citrus. Het gebied waar het kasteel is gebouwd, was al bewoond sinds de Oudheid. Voorheen lag dit kasteel op een klein eiland en was door een boogbrug met Kos verbonden. Deze brug vindt men daar nog steeds. Zij overspant nu hiermee de bekende palmen Lane. De laan is aangelegd nadat het water tussen het eiland en het kasteel was gedempt.",
    "v1": "Het kasteel ligt direct aan de haven in het hart van Kos-stad. Bij aankomst in de haven is het kasteel onmiddellijk herkenbaar. De Ridders van Sint-Jan (Johannieters) begonnen in de late 14e eeuw met de bouw, Voor de komst van de Kruisridders was er al een kleine vesting, gebouwd door de Venetianen, die de haven beschermde. Door een gebrek aan archeologisch onderzoek is er weinig duidelijkheid over deze vroegere bouwwerken.",
    "v2": "Toen grootmeester Foulques de Villaret van de Johannieter Orde het eiland in 1315 in haar bezit nam, werd er al gestart met kleine fortificaties. Onder het grootmeesterschap van Juan Fernandez de Heredia werd er gestart met de bouw van het huidige kasteel. Bij de bouw werden vele stenen gebruikt van de nabije ruïne van het Asklepion.",
    "v3": "Door enkele gevechten met het Osmaanse Rijk en de Egyptische Mammelukken (slaven die opgeleid werden tot militairen) werd het kasteel door de jaren heen verder uitgebreid. Het kasteel heeft dubbele muren met ronde torens, een typisch voorbeeld van ridderlijke verdedigingskunst in de Dodekanesos. Het beschermde de haven tegen Ottomaanse aanvallen en gaf uitzicht over zee en de stad.",
    "v4": "Ook na de val van Constantinopel bleef de Orde de zeestraat bewaken. In 1457 werd het eiland aangevallen door een Ottomaanse legermacht. Na 23 dagen verliet de aanvallende legermacht het eiland vanwege onbekende redenen.",
    "v5": "Na het mislukte Beleg van Rhodos in 1480 en een in 1493 volgende aardbeving gaf grootmeester Pierre d'Aubusson de opdracht tot de bouw van het buitenfort. Ook door de komst van het buskruit bij het oorlog voeren, werden er ook nog andere punten van het fort verbeterd. Na de nederlaag van de Orde tijdens het Tweede Beleg van Rhodos gaf de Orde haar bezittingen van de eilanden op en verlieten ze het eiland in 1523.",
    "v6": "Tijdens Italiaanse overheersing van het eiland werd het kasteel gerestaureerd en werden de Turkse invloeden verwijderd, om het middeleeuwse karakter van de burcht te benadrukken.",
    "k1": "In juli tweeduizend zeventien raakte het kasteel opnieuw zwaar beschadigd door een aardbeving van zes komma zeven op de schaal van Richter. Het bleef jarenlang gesloten voor restauratie. Die werkzaamheden zijn recent afgerond en het kasteel is weer toegankelijk.Vandaag de dag kun je er gratis of tegen een kleine toegangsprijs doorheen wandelen.",

    "s1": "Wir sind jetzt auf der Burg Neratzia, auch bekannt als die Burg der Ritter. Dieses Schloss liegt direkt am Hafen, direkt am Eingang zur Stadt Kos. Früher befand es sich auf einer kleinen Insel, die durch eine Zugbrücke mit dem Festland verbunden war.",

    "s7": "Der Name Neratzia stammt von den Bitterorangenbäumen (Nerantzia), die die Ritter im späten 14. und frühen 15. Jahrhundert überall auf Kos pflanzten – die Insel duftete damals herrlich nach Zitrusfrüchten. Das Gebiet, in dem die Burg erbaut wurde, war seit der Antike bewohnt. Zuvor befand sich diese Burg auf einer kleinen Insel und war durch eine Bogenbrücke mit Kos verbunden. Diese Brücke ist noch immer dort zu finden. Es erstreckt sich jetzt über die berühmte Palms Lane. Die Allee wurde gebaut, nachdem das Wasser zwischen der Insel und der Burg aufgefüllt worden war.",

    "v2": "Als Großmeister Foulques de Villaret vom Orden des Heiligen Johannes 1315 die Insel in Besitz nahm, wurde bereits mit kleinen Befestigungsanlagen begonnen. Der Bau des heutigen Schlosses begann unter der großen Leitung von Juan Fernandez de Heredia. Für den Bau wurden viele Steine ​​aus den nahegelegenen Ruinen des Asklepieion verwendet.",
    "v3": "Aufgrund mehrerer Kämpfe mit dem Osmanischen Reich und den ägyptischen Mamluken (Sklaven, die als Soldaten ausgebildet wurden) wurde die Burg im Laufe der Jahre immer weiter ausgebaut. Die Burg hat doppelte Mauern mit runden Türmen, ein typisches Beispiel ritterlicher Verteidigungskunst auf dem Dodekanes. Es schützte den Hafen vor osmanischen Angriffen und gewährte einen Ausblick auf das Meer und die Stadt.",
    "v4": "Auch nach dem Fall Konstantinopels bewachte der Orden weiterhin die Meerenge. Im Jahr 1457 wurde die Insel von einer osmanischen Armee angegriffen. Nach 23 Tagen verließ die angreifende Armee aus unbekannten Gründen die Insel.",
    "v5": "Nach der gescheiterten Belagerung von Rhodos im Jahr 1480 und einem darauf folgenden Erdbeben im Jahr 1493 befahl Großmeister Pierre d'Aubusson den Bau der äußeren Festung. Aufgrund der Einführung von Schießpulver im Krieg wurden auch andere Punkte der Festung verbessert. Nach der Niederlage des Ordens während der Zweiten Belagerung von Rhodos gab der Orden seine Besitztümer auf den Inseln auf und verließ die Insel im Jahr 1523.",

    "k2": "Durch das schwere Erdbeben im Jahr 2017 wurde die Burg beschädigt und war einige Zeit instabil. Aus diesem Grund war es für vier Jahre geschlossen. Obwohl die Burg vorübergehend geöffnet war, ist sie seit 2024 nicht mehr zugänglich. Die Burg Nerátzia, auch Kreuzritterburg oder Johannieter-Burg genannt, ist nach wie vor eine wichtige historische Sehenswürdigkeit."

    "lead": "We are now at Neratzia Castle, also known as the Castle of the Knights.",
    "s1": "We are now at Neratzia Castle, also known as the Castle of the Knights. This castle is located right on the harbor, right at the entrance to Kos Town. It used to be on a small island connected to the mainland by a drawbridge.",
    "s2": "Because the water has been filled in, which is now the road with the palm trees, you still have to enter the castle via the bridge. The Knights of the Order of Saint John started building the castle at the end of the fourteenth century. The real main construction started in fourteen thirty-six and was not completed until seventy-eight years later. They built it in two parts: an inner fortress with four round towers and later an outer rampart with additional bastions.",
    "s3": "For the construction they used many stones from ancient ruins, including from the Asclepion. The knights needed the castle to protect the harbor against pirates and attacks from the Ottomans and the Egyptian Mamluks. In fourteen fifty-seven the Ottomans held the castle under siege for twenty-three days, but they eventually withdrew.",

    "s7": "The name Neratzia comes from the bitter orange trees (nerantzia) that the knights planted all over Kos in the late 14th and early 15th centuries - the island then smelled wonderfully of citrus. The area where the castle was built had been inhabited since ancient times. Previously, this castle was located on a small island and was connected to Kos by an arch bridge. This bridge can still be found there. It now spans the famous Palms Lane. The avenue was constructed after the water between the island and the castle was filled in.",
    "v1": "The castle is located right on the harbor in the heart of Kos Town. Upon arrival at the port, the castle is immediately recognizable. The Knights of Saint John (Johannieters) started construction in the late 14th century. Before the arrival of the Crusaders, there was already a small fortress, built by the Venetians, that protected the harbor. Due to a lack of archaeological research, there is little clarity about these earlier structures.",
    "v2": "When Grand Master Foulques de Villaret of the Order of Saint John took possession of the island in 1315, small fortifications had already begun. Construction of the current castle started under the grand mastership of Juan Fernandez de Heredia. Many stones from the nearby ruins of the Asclepion were used in its construction.",
    "v3": "Due to several battles with the Ottoman Empire and the Egyptian Mamluks (slaves who were trained as soldiers), the castle was further expanded over the years. The castle has double walls with round towers, a typical example of knightly defensive art in the Dodecanese. It protected the harbor against Ottoman attacks and provided a view of the sea and the city.",
    "v4": "Even after the fall of Constantinople, the Order continued to guard the strait. In 1457 the island was attacked by an Ottoman army. After 23 days, the attacking army left the island for unknown reasons.",
    "v5": "After the failed Siege of Rhodes in 1480 and an earthquake that followed in 1493, Grand Master Pierre d'Aubusson ordered the construction of the outer fortress. Due to the arrival of gunpowder in war, other points of the fort were also improved. After the Order's defeat during the Second Siege of Rhodes, the Order gave up its possessions of the islands and left the island in 1523.",
    "v6": "During Italian rule of the island, the castle was restored and the Turkish influences were removed, to emphasize the medieval character of the castle.",
    "k1": "In July two thousand and seventeen, the castle was again seriously damaged by an earthquake measuring six point seven on the Richter scale. It remained closed for restoration for many years. That work was recently completed and the castle is accessible again. Today you can walk through it for free or for a small entrance fee.",
    "k2": "The castle suffered damage due to the major earthquake of 2017 and was unstable for some time. For that reason it was closed for four years. Although the castle was temporarily open, it has been inaccessible since 2024. Nerátzia Castle, also known as the Knights of the Cross or Johannieter's Castle, remains an important historical attraction."

    "lead": "Siamo ora al Castello di Neratzia, conosciuto anche come Castello dei Cavalieri.",
    "s1": "Siamo ora al Castello di Neratzia, conosciuto anche come Castello dei Cavalieri. Questo castello si trova proprio sul porto, proprio all'ingresso della città di Kos. Un tempo si trovava su una piccola isola collegata alla terraferma da un ponte levatoio.",
    "s2": "Poiché è stata riempita l'acqua, che ora è la strada con le palme, bisogna ancora entrare nel castello attraverso il ponte. I Cavalieri dell'Ordine di San Giovanni iniziarono la costruzione del castello alla fine del XIV secolo. La vera costruzione principale iniziò nel quattordici-trentasei e non fu completata fino a settantotto anni dopo. Lo costruirono in due parti: una fortezza interna con quattro torri rotonde e successivamente un bastione esterno con bastioni aggiuntivi.",
    "s3": "Per la costruzione furono utilizzate molte pietre provenienti da antiche rovine, tra cui l'Asclepion. I cavalieri avevano bisogno del castello per proteggere il porto dai pirati e dagli attacchi degli Ottomani e dei Mamelucchi egiziani. Nel 1457 gli Ottomani tennero il castello sotto assedio per ventitré giorni, ma alla fine si ritirarono.",
    "s4": "Nel quindici e ventitré i cavalieri lasciarono Kos dopo la sconfitta a Rodi. Poi gli Ottomani presero il controllo del castello. Serviva come guarnigione e residenza per il governatore ottomano.",
    "s5": "Nel diciotto e sedici esplose la polveriera, distruggendo gran parte del castello. Durante il periodo italiano nel XX secolo, gli italiani restaurarono completamente il castello. Rimossero le aggiunte ottomane e cercarono di riportarlo il più possibile allo stile medievale.",
    "s6": "Vedrai le doppie mura, le torri rotonde e i resti delle antiche fortificazioni. Dalle mura si ha una bellissima vista sul porto e sulla città.",
    "s7": "Il nome Neratzia deriva dagli alberi di arancio amaro (nerantzia) che i cavalieri piantarono in tutta Kos tra la fine del XIV e l'inizio del XV secolo - l'isola allora profumava meravigliosamente di agrumi. La zona dove venne edificato il castello era abitata fin dall'antichità. In precedenza, questo castello si trovava su una piccola isola ed era collegato a Kos da un ponte ad arco. Questo ponte può ancora essere trovato lì. Ora attraversa la famosa Palms Lane. Il viale fu costruito dopo che l'acqua tra l'isola e il castello fu riempita.",
    "v1": "Il castello si trova proprio sul porto, nel cuore della città di Kos. All'arrivo al porto il castello è subito riconoscibile. I Cavalieri di San Giovanni (Johannieters) iniziarono la costruzione alla fine del XIV secolo. Prima dell'arrivo dei crociati esisteva già una piccola fortezza, costruita dai veneziani, che proteggeva il porto. A causa della mancanza di ricerche archeologiche, c'è poca chiarezza su queste strutture precedenti.",

    "v3": "A causa di numerose battaglie con l'Impero Ottomano e i Mamelucchi egiziani (schiavi addestrati come soldati), il castello fu ulteriormente ampliato nel corso degli anni. Il castello è dotato di doppia cinta muraria con torri circolari, tipico esempio di arte difensiva cavalleresca del Dodecaneso. Proteggeva il porto dagli attacchi ottomani e offriva una vista sul mare e sulla città.",

    "v5": "Dopo il fallito assedio di Rodi nel 1480 e il terremoto che seguì nel 1493, il Gran Maestro Pierre d'Aubusson ordinò la costruzione della fortezza esterna. A causa dell'arrivo della polvere da sparo in guerra furono migliorati anche altri punti del forte. Dopo la sconfitta dell'Ordine durante il Secondo Assedio di Rodi, l'Ordine rinunciò ai suoi possedimenti sulle isole e lasciò l'isola nel 1523.",
